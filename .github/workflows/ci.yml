name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path GameBoy/Cargo.toml -- --check

      - name: Compile all targets
        run: cargo check --manifest-path GameBoy/Cargo.toml --all-targets

      - name: Run tests
        run: cargo test --manifest-path GameBoy/Cargo.toml --all-targets

      - name: Run release-mode tests
        if: runner.os == 'Linux'
        run: cargo test --release --manifest-path GameBoy/Cargo.toml --all-targets

  msrv:
    name: Minimum supported Rust (1.78)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust 1.78
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path GameBoy/Cargo.toml -- --check

      - name: Compile all targets
        run: cargo check --manifest-path GameBoy/Cargo.toml --all-targets

      - name: Run tests
        run: cargo test --manifest-path GameBoy/Cargo.toml --all-targets
