[package]
name = "gameboy"
version = "0.1.0"
description = "Experimental Game Boy Advance emulation core for PeaceEmu"
edition = "2021"
license = "MIT"
rust-version = "1.78"
repository = "https://github.com/Likounsee/PeaceEmu-GB"

[[bin]]
name = "peaceemu-gba"
path = "src/bin/peaceemu.rs"

[dependencies]
minifb = "0.27"
# Keep minifb's transitive tempfile dependency compatible with the Rust 1.78 MSRV.
tempfile = "=3.10.1"
